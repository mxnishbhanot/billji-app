# ---------------------------------------------------------------------------
# Weekly Android preview build.
#
# Triggers ONLY on a push to `main`. The intended flow:
#   feature/*  ->  staging  (developers merge here all week, NO builds)
#   staging    ->  main     (you merge manually on the weekend after verifying)
#   main push  ->  this workflow runs ONE EAS preview build  ->  Discord
#
# Because nothing auto-merges into `main`, this consumes ~1 EAS build/week.
# Pull requests, `staging`, and `feature/*` never trigger a build.
# ---------------------------------------------------------------------------
name: Android Preview Build

on:
  push:
    branches:
      - main

jobs:
  preview:
    name: Build & notify
    uses: ./.github/workflows/_reusable-eas-build.yml
    with:
      platform: android
      profile: preview
    # Forward org/repo secrets to the reusable workflow.
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
